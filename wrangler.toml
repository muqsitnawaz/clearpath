name = "clearpath"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "clearpath"
database_id = "REPLACE_AFTER_d1_create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "clearpath-media"
